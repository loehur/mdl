<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR KASIR</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='7'/%3E%3Crect x='14' y='3' width='7' height='7'/%3E%3Crect x='14' y='14' width='7' height='7'/%3E%3Cpath d='M14 14h7v7h-7z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/qrcode.min.js"></script>
</head>

<body>
    <div class="page">

        <!-- Login -->
        <div class="form-kasir" id="form-kasir">
            <input type="tel" inputmode="numeric" pattern="[0-9]*" id="kasir-id-input"
                placeholder="ID CABANG" autofocus>
            <button type="button" onclick="saveKasirId()">HUBUNGKAN</button>
            <div class="form-error" id="form-error"></div>
        </div>

        <!-- Display -->
        <div class="qr-display" id="qr-display">
            <!-- Top bar: ID | RELOAD | LOGOUT | STATUS -->
            <table class="top-bar" cellspacing="0" cellpadding="0">
                <tr>
                    <td class="col-id" id="kasir-id-label">#</td>
                    <td class="col-action">
                        <button type="button" class="btn-bar" onclick="reloadPage()">RELOAD</button>
                    </td>
                    <td class="col-action">
                        <button type="button" class="btn-bar" onclick="logout()">LOGOUT</button>
                    </td>
                    <td class="col-status">
                        <span class="status-box disconnected" id="status-box"></span>
                    </td>
                </tr>
            </table>

            <div class="row-status-msg" id="status-label"></div>

            <div class="row-qr">
                <div id="qr-container"></div>
            </div>

            <div class="row-text" id="qr-text"></div>
        </div>

    </div>

    <!-- Payment Success -->
    <div class="payment-success-overlay" id="payment-success-overlay">
        <div class="payment-success-inner">
            <div class="success-icon">✓</div>
            <div class="success-text">PEMBAYARAN<br>BERHASIL</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
