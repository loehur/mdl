<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Kasir</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='7'/%3E%3Crect x='14' y='3' width='7' height='7'/%3E%3Crect x='14' y='14' width='7' height='7'/%3E%3Cpath d='M14 14h7v7h-7z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/qrcode.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Form Input ID Cabang -->
        <div class="form-kasir" id="form-kasir">
            <h2>Masukan ID Cabang</h2>
            <input type="tel" inputmode="numeric" pattern="[0-9]*" id="kasir-id-input" autofocus>

            <button onclick="saveKasirId()">Hubungkan</button>
        </div>

        <!-- QR Display -->
        <div class="qr-display" id="qr-display">
            <div class="qr-header">
                <span class="kasir-id-label" id="kasir-id-label"></span>
                <div class="status-box disconnected" id="status-box"></div>
                <span class="status-label" id="status-label"></span>
                <button type="button" class="btn-logout" id="btn-logout" onclick="logout()">Logout</button>
            </div>
            <div id="qr-container"></div>
            <div id="qr-text"></div>
        </div>

        <!-- Payment Success Overlay -->
        <div class="payment-success-overlay" id="payment-success-overlay">
            <div class="success-icon">✓</div>
            <div class="success-text">Pembayaran Berhasil</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
