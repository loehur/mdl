# Tempel ke aaPanel vhost wadesk_server (ganti file VirtualHost yang ada).
# Wajib: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite
# Node: listening 127.0.0.1:3010

<VirtualHost *:80>
    ServerAdmin admin@wadesk_server
    DocumentRoot "/www/wwwroot/mdl/node/wadesk_server"
    ServerName 80.wadesk_server
    ServerAlias wadeskserver.nalju.com
    ErrorLog "/www/wwwlogs/wadesk_server-error_log"
    CustomLog "/www/wwwlogs/wadesk_server-access_log" combined

    <Files ~ (\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md|package.json|package-lock.json|\.env)$>
       Order allow,deny
       Deny from all
    </Files>

    ProxyPass /.well-known/ !

    <IfModule mod_proxy.c>
        ProxyRequests Off
        SSLProxyEngine on

        # WebSocket — HARUS ada (tanpa ini handshake jadi HTTP 200)
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule /(.*) ws://127.0.0.1:3010/$1 [P,L]

        ProxyPass / http://127.0.0.1:3010/
        ProxyPassReverse / http://127.0.0.1:3010/
        ProxyTimeout 86400
    </IfModule>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin admin@wadesk_server
    DocumentRoot "/www/wwwroot/mdl/node/wadesk_server"
    ServerName 443.wadesk_server
    ServerAlias wadeskserver.nalju.com
    ErrorLog "/www/wwwlogs/wadesk_server-error_log"
    CustomLog "/www/wwwlogs/wadesk_server-access_log" combined

    SSLEngine On
    SSLCertificateFile /www/server/panel/vhost/cert/wadesk_server/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/wadesk_server/privkey.pem
    SSLCipherSuite EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1
    SSLHonorCipherOrder On

    <Files ~ (\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md|package.json|package-lock.json|\.env)$>
       Order allow,deny
       Deny from all
    </Files>

    ProxyPass /.well-known/ !

    <IfModule mod_proxy.c>
        ProxyRequests Off
        SSLProxyEngine on

        # WebSocket — HARUS ada (tanpa ini handshake jadi HTTP 200)
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule /(.*) ws://127.0.0.1:3010/$1 [P,L]

        ProxyPass / http://127.0.0.1:3010/
        ProxyPassReverse / http://127.0.0.1:3010/
        ProxyTimeout 86400
    </IfModule>
</VirtualHost>
