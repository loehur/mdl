services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env.docker
    ports:
      - "5434:5432"
    volumes:
      - nemu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemu -d nemu"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: runtime
    env_file: .env.docker
    command: ["npm", "run", "migrate:prod"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    env_file: .env.docker
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    env_file: .env.docker
    depends_on:
      api:
        condition: service_healthy

volumes:
  nemu_postgres_data:
